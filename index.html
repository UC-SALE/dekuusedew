<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Big Bold Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* Change background color here */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .big-bold-text {
            /* BIG & BOLD styling using modern CSS */
            font-size: 10vw; /* Responsive size: scales automatically with screen width */
            font-weight: 900; /* Extra bold weight */
            line-height: 1.1;
            color: #000000; /* Change text color here */
            
            /* FULL constraints */
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="big-bold-text">222 dulguun [Tsetseg zahialaga]</h1>
    </div>

</body>
</html>
